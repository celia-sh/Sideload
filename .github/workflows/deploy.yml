name: Build and deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - public/source.json
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  deployments: write

concurrency:
  group: sideload-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh AltSource releases
        run: npm run sync:source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect source changes
        id: source
        shell: bash
        run: |
          if git diff --quiet -- public/source.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No upstream release update found."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "A source update was found."
          fi

      - name: Commit source update
        if: steps.source.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/source.json
          git commit -m "chore: update AltSource releases"
          git push

      - name: Build site
        if: steps.source.outputs.changed == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: npm run build

      - name: Deploy to Cloudflare Pages
        if: steps.source.outputs.changed == 'true' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "latest"
          command: pages deploy dist --project-name=sideload
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
